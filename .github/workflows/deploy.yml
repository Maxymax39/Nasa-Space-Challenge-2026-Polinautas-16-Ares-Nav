name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate data files
        run: |
          for f in assets/data/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f"
            echo "ok: $f"
          done

      # Site layout:
      #   /                          -> general page (web/index.html) and its PDFs
      #   /ares-nav-mars-eva-main/   -> the ARES-NAV application
      - name: Assemble site
        run: |
          mkdir -p _site/ares-nav-mars-eva-main
          cp -r index.html src assets _site/ares-nav-mars-eva-main/
          cp -r web/. _site/

      # The user manual (45 MB) is stored in the repository as 8 MB parts,
      # because it exceeds the size limit of GitHub's web upload. It is
      # rebuilt here and checked against the checksum of the original file.
      - name: Rebuild user manual PDF
        run: |
          cat manual-parts/manual.pdf.part* > "_site/Manual de uso de ARES-NAV.pdf"
          echo "5f2ae08663bf0adae87931fa3311145772d94bcb9663e829df38463c2a10660c  _site/Manual de uso de ARES-NAV.pdf" | sha256sum -c -

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
